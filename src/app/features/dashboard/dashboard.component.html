<header class="page-header">
  <!-- Navigation -->
  <nav class="header-nav">
    <a href="#" class="logo">ACEUP</a>
    <ul class="options">
      <li><a href="#">Explore</a></li>
      <li><a href="#">Matches</a></li>
      <li><a href="#">Community</a></li>
    </ul>
    <div class="buttons-container">
      <ng-container *ngIf="!isLoggedIn else showProfile">
        <button class="btn" (click)="showLogin = true">Login</button>
      </ng-container>
      <ng-template #showProfile>
        <app-profile-avatar></app-profile-avatar>
      </ng-template>    
    </div>
  </nav>

  <!-- Hero content -->
  <div class="hero-content">
    <h1>Level Up Your Game</h1>
    <p>Connect. Compete. Conquer. Start your journey with ACEUP today!</p>
    <a href="#" class="btn">Get Started</a>
  </div>

  <!-- Background video -->
  <video autoplay loop muted class="video-container">
    <source src="/videos/video1.mp4" type="video/mp4" />
  </video>
</header>


<!-- ✅ Login overlay -->
<app-login *ngIf="showLogin" (close)="showLogin = false"></app-login>
